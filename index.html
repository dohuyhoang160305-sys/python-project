<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Flask & Gemini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%; max-width: 480px; height: 580px;
            background: #ffffff; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header {
            background: #0084ff; color: #ffffff;
            padding: 16px; text-align: center; font-size: 1.1rem; font-weight: bold;
        }
        .chat-messages {
            flex: 1; padding: 16px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px; background: #f9f9f9;
        }
        .message {
            max-width: 80%; padding: 10px 14px; border-radius: 16px;
            font-size: 0.95rem; line-height: 1.4; word-wrap: break-word;
        }
        .user-message { align-self: flex-end; background-color: #0084ff; color: #ffffff; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background-color: #e4e6eb; color: #000000; border-bottom-left-radius: 4px; }
        .chat-input-container { display: flex; padding: 12px; background: #ffffff; border-top: 1px solid #ddd; }
        .chat-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 0.95rem; }
        .chat-input:focus { border-color: #0084ff; }
        .send-btn {
            margin-left: 8px; padding: 10px 18px; background-color: #0084ff; color: white;
            border: none; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .send-btn:hover { background-color: #006bce; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 AI Chatbot (Gemini)</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Xin chào! Tôi có thể giúp gì cho bạn hôm nay?</div>
    </div>
    <div class="chat-input-container">
        <input type="text" id="userInput" class="chat-input" placeholder="Nhập câu hỏi..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const messagesDiv = document.getElementById('chatMessages');
        const text = input.value.trim();

        if (!text) return;

        const userMsgDiv = document.createElement('div');
        userMsgDiv.className = 'message user-message';
        userMsgDiv.textContent = text;
        messagesDiv.appendChild(userMsgDiv);

        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message bot-message';
        loadingDiv.textContent = 'AI đang suy nghĩ...';
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            messagesDiv.removeChild(loadingDiv);

            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'message bot-message';
            
            if (data.reply) {
                botMsgDiv.textContent = data.reply;
            } else {
                botMsgDiv.style.color = 'red';
                botMsgDiv.textContent = 'Lỗi: ' + (data.error || 'Không thể lấy phản hồi');
            }
            messagesDiv.appendChild(botMsgDiv);
        } catch (error) {
            messagesDiv.removeChild(loadingDiv);
            const errDiv = document.createElement('div');
            errDiv.className = 'message bot-message';
            errDiv.style.color = 'red';
            errDiv.textContent = 'Lỗi kết nối máy chủ.';
            messagesDiv.appendChild(errDiv);
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
